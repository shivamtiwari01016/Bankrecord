spring:
  datasource:
    # MODE=MYSQL keeps native reporting queries behaviour aligned with production.
    # LOCK_TIMEOUT gives concurrent pessimistic-lock waiters time to acquire the row lock.
    url: jdbc:h2:mem:bankrecon_test;DB_CLOSE_DELAY=-1;MODE=MYSQL;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.bankrecon: WARN
    org.springframework: WARN

server:
  port: 0
